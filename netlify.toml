[build]
    publish = "build"
    command = "npm run build"

[build.environment]
    NODE_VERSION = "24"

[[headers]]
    for = "/*"

    [headers.values]
        X-Content-Type-Options = "nosniff"
        X-Frame-Options = "DENY"
        Referrer-Policy = "strict-origin-when-cross-origin"
        Content-Security-Policy-Report-Only = "default-src 'self'; script-src 'self'; style-src 'self' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; font-src 'self' https://cdn.jsdelivr.net; img-src 'self' data:; connect-src 'self' https://formspree.io; form-action 'self' https://formspree.io; base-uri 'self'; object-src 'none'; frame-ancestors 'none'"

[[redirects]]
    from = "/*"
    to = "/"
    status = 200
    force = false
